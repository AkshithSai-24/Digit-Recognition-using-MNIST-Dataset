<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Recognition using MNIST Dataset</title>
    <link href="/static/styles.css" rel="stylesheet">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <div class="canvas-section">
        <h2 class="heading">Digit Recognition using MNIST Dataset</h2>
        <div class="canvas-container">
            <canvas id="myCanvas" width="28" height="28"></canvas>
        </div>
        <div class="button-container">
            <button id="resetButton" class="button">Reset Canvas</button>
            <button id="submitButton" class="button">Submit Image</button>
        </div>
        <textarea id="responseTextArea" readonly placeholder="Server response will appear here..."></textarea>
    </div>
</body>
</html>
